<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI StudyBuddy — Your personal academic intelligence platform. Solve doubts, generate study plans, explore career paths, and more." />
    <meta name="theme-color" content="#0a0a0e" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: DM Serif Display (headings) + DM Sans (body) -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:title"       content="AI StudyBuddy" />
    <meta property="og:description" content="Your personal academic intelligence platform." />
    <meta property="og:type"        content="website" />

    <title>AI StudyBuddy — Academic OS</title>

    <style>
      /* Critical CSS — prevents flash of unstyled content */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body, #root {
        height: 100%;
        background-color: #0a0a0e;
        color: #e8e4f0;
        font-family: 'DM Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Loading screen shown before React hydrates */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0e;
        z-index: 9999;
        flex-direction: column;
        gap: 16px;
        transition: opacity 0.3s ease;
      }

      #app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-logo {
        font-family: 'DM Serif Display', Georgia, serif;
        font-size: 28px;
        color: #e8e4f0;
        letter-spacing: -0.5px;
      }

      .loading-logo span {
        color: #9b6dff;
      }

      .loading-bar {
        width: 120px;
        height: 2px;
        background: #1e1e2a;
        border-radius: 2px;
        overflow: hidden;
      }

      .loading-bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        background: #9b6dff;
        border-radius: 2px;
        animation: slide 1.2s ease-in-out infinite;
      }

      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>

  <body>
    <!-- Loading screen (hidden once React mounts) -->
    <div id="app-loading">
      <div class="loading-logo">Study<span>Buddy</span></div>
      <div class="loading-bar"></div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!-- Hide loading screen once React is ready -->
    <script>
      window.__hideLoader = function () {
        var el = document.getElementById('app-loading');
        if (el) {
          el.classList.add('hidden');
          setTimeout(function () { el.remove(); }, 400);
        }
      };
    </script>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
